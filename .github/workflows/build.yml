name: Release builds and checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
jobs:
  desktop:
    name: Desktop / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify runner architecture matches the download label
        shell: bash
        run: |
          host=$(rustc -vV | awk '/^host:/ { print $2 }' | tr -d '\r')
          if [ "$host" != '${{ matrix.target }}' ]; then
            echo "Runner target $host does not match advertised target ${{ matrix.target }}"
            exit 1
          fi
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libgl1-mesa-dri libxkbcommon0 libxrender1 libxtst6 fonts-dejavu-core xvfb xauth
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --workspace --release --locked
      - name: Test runtime-variant packaging
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Test shared UI and package optimized desktop image (no publisher signing)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a bash apps/compose/gradlew -p apps/compose :shared:desktopTest :desktopApp:createReleaseDistributable :desktopApp:writeRuntimeMetadata
          else
            bash apps/compose/gradlew -p apps/compose :shared:desktopTest :desktopApp:createReleaseDistributable :desktopApp:writeRuntimeMetadata
          fi
      - name: Package bundled-runtime and external-Java downloads
        shell: bash
        run: |
          cargo metadata --format-version 1 --locked --filter-platform '${{ matrix.target }}' > target/rust-metadata.json
          image=apps/compose/desktopApp/build/compose/binaries/main-release/app/OpenBuds
          launcher=target/release/openbuds-launcher
          if [ "$RUNNER_OS" = macOS ]; then image="$image.app"; fi
          if [ "$RUNNER_OS" = Windows ]; then launcher="$launcher.exe"; fi
          for runtime in bundled external-java; do
            python tools/package_release.py --platform '${{ matrix.platform }}' --runtime "$runtime" --launcher "$launcher" --image "$image" --rust-metadata target/rust-metadata.json --jvm-metadata apps/compose/desktopApp/build/runtime-artifacts.tsv
          done
      - name: Package standalone CLI and separate C SDK
        shell: bash
        run: |
          python tools/package_native.py --platform '${{ matrix.platform }}' --product cli
          python tools/package_native.py --platform '${{ matrix.platform }}' --product c-sdk
      - name: Package Rust SDK source workspace
        if: runner.os == 'Linux'
        run: python tools/package_native.py --product rust-sdk
      - name: Smoke-check both launchers and real renderers (no Bluetooth)
        shell: bash
        run: |
          image=apps/compose/desktopApp/build/compose/binaries/main-release/app/OpenBuds
          if [ "$RUNNER_OS" = macOS ]; then image="$image.app"; fi
          root='target/packages/staging/OpenBuds-${{ matrix.platform }}-external-java/OpenBuds'
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python tools/smoke_desktop.py --platform '${{ matrix.platform }}' --image "$image" --external "$root"
          else
            python tools/smoke_desktop.py --platform '${{ matrix.platform }}' --image "$image" --external "$root"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: OpenBuds-CLI-${{ matrix.platform }}
          path: target/packages/OpenBuds-${{ matrix.platform }}-cli.*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: OpenBuds-C-SDK-${{ matrix.platform }}
          path: target/packages/OpenBuds-${{ matrix.platform }}-c-sdk.*
          if-no-files-found: error
          retention-days: 14
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: OpenBuds-Rust-SDK-source
          path: target/packages/OpenBuds-rust-sdk-source.tar.gz*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: OpenBuds-desktop-${{ matrix.platform }}-bundled-runtime
          path: target/packages/*-bundled-runtime.*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: OpenBuds-desktop-${{ matrix.platform }}-external-java
          path: target/packages/*-external-java.*
          if-no-files-found: error
          retention-days: 14
      - name: Print native packaging errors
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in sorted(Path("apps/compose/desktopApp/build/compose/logs").rglob("*.txt")):
              print(f"--- {path} ---")
              print(path.read_text(encoding="utf-8", errors="replace")[-24000:])
          PY
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-desktop-${{ matrix.platform }}
          path: |
            apps/compose/shared/build/reports/tests/
            apps/compose/shared/build/reports/ui/
            apps/compose/desktopApp/build/compose/logs/
            apps/compose/desktopApp/build/compose/tmp/*.args.txt
          retention-days: 7
  android:
    name: Android / optimized release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v6
      - run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: bash apps/compose/gradlew -p apps/compose :androidApp:assembleRelease :androidApp:lintRelease :androidApp:writeRuntimeMetadata
      - name: Verify APK signing, alignment and non-debuggable manifest
        shell: bash
        run: |
          apk=apps/compose/androidApp/build/outputs/apk/release/androidApp-release.apk
          tools="$ANDROID_HOME/build-tools/37.0.0"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/aapt" dump badging "$apk" > target/apk-badging.txt
          "$tools/aapt" dump permissions "$apk" > target/apk-permissions.txt
          if grep -q application-debuggable target/apk-badging.txt; then echo 'Refusing a debuggable APK'; exit 1; fi
          if grep -E 'android.permission.(INTERNET|BLUETOOTH_SCAN|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|ACCESS_BACKGROUND_LOCATION)' target/apk-permissions.txt; then echo 'Refusing unexpected network, scanning, or location permissions'; exit 1; fi
      - name: Package APK with notices and source information
        run: |
          cargo metadata --format-version 1 --locked --filter-platform aarch64-linux-android > target/rust-metadata.json
          python tools/package_release.py --platform android --apk apps/compose/androidApp/build/outputs/apk/release/androidApp-release.apk --rust-metadata target/rust-metadata.json --jvm-metadata apps/compose/androidApp/build/runtime-artifacts.tsv
      - uses: actions/upload-artifact@v7
        with:
          name: OpenBuds-Android-release
          path: target/packages/staging/OpenBuds-android-release/
          if-no-files-found: error
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-android
          path: apps/compose/androidApp/build/reports/lint-results-release.*
          retention-days: 7
