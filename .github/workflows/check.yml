name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop-and-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libudev-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dri libxrender1 libxtst6 fonts-dejavu-core xvfb xauth
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Test shared Compose UI
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a bash apps/compose/gradlew -p apps/compose :shared:desktopTest
          else
            bash apps/compose/gradlew -p apps/compose :shared:desktopTest
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-ui-tests-${{ runner.os }}
          path: |
            apps/compose/shared/build/reports/tests/desktopTest/
            apps/compose/shared/build/reports/ui/
          retention-days: 7
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libclang-dev
      - run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: bash apps/compose/gradlew -p apps/compose :androidApp:assembleRelease :androidApp:lintRelease -PrustAbis=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: openbuds-android-release
          path: apps/compose/androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint
          path: apps/compose/androidApp/build/reports/lint-results-release.*
          retention-days: 7
