[workspace]
members = ["crates/realme-buds", "crates/realme-buds-windows", "crates/realme-buds-linux", "bindings/c", "apps/cli", "apps/tray", "apps/launcher"]
default-members = ["crates/realme-buds", "crates/realme-buds-windows"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"
repository = "https://github.com/khanra17/openbuds"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
